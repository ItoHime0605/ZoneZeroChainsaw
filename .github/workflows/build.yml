name: NeoForge build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test standalone cutting and processing rules
        run: |
          mkdir -p build/logic-test
          javac -d build/logic-test src/main/java/tw/zonezero/chainsaw/logic/*.java src/test/java/tw/zonezero/chainsaw/logic/*.java
          java -ea -cp build/logic-test tw.zonezero.chainsaw.logic.LogicSmokeTest
      - name: Install audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate original audio, model, HUD and 8-frame chain motion
        run: python3 tools/generate_media.py
      - name: Verify fuel and held-cut server safety regressions
        run: python3 tools/verify_safety.py
      - name: Validate original chainsaw sound durations and gain
        run: python3 tools/verify_audio.py
      - name: Validate 3D assets and localization
        run: python3 tools/verify_assets.py
      - name: Compile mod
        run: gradle build --stacktrace --no-daemon
      - name: Upload developer build JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zonezero-chainsaw-0.1.23-alpha-dev
          path: build/libs/*.jar
          if-no-files-found: error
